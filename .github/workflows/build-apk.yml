name: Build APK

# Jalankan manual dari tab Actions (Run workflow), atau otomatis setiap ada push.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cari proyek Gradle (ekstrak ZIP bila perlu)
        id: locate
        run: |
          zipfile=$(ls ./*.zip 2>/dev/null | head -n1 || true)
          if [ ! -f settings.gradle ] && [ -n "$zipfile" ]; then
            mkdir -p _unzipped
            unzip -q "$zipfile" -d _unzipped
          fi
          found=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$found" ]; then
            echo "settings.gradle tidak ditemukan. Unggah isi proyek atau file ZIP-nya ke root repo."
            exit 1
          fi
          dir=$(dirname "$found")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Proyek ditemukan di: $dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECL-Floating-Menu-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
